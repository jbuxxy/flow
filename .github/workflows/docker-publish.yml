name: Build and publish Docker image

on:
  push:
    branches: [main]
    # A release: tagging a commit vYYYY.M.N publishes it as :YYYY.M.N and
    # :stable on top of the :latest every push to main already gets.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_VAPID_PUBLIC_KEY is a public web-push VAPID key, not a
      # secret in nature, but stored as a repo secret anyway for consistency
      # with everything else the build touches — see Dockerfile's own
      # comment on why it has to be a build arg (NEXT_PUBLIC_* vars are
      # inlined by `next build`, too late to supply at container runtime).
      # main -> :latest (what an always-current deploy pulls); a vX tag ->
      # :X + :stable (what a self-hoster pins to). Both also get :<sha>.
      # The version comes from the tag (main builds: the latest release's),
      # not package.json — the nightly release (release.yml) only tags.
      - id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=$img:${GITHUB_REF#refs/tags/v},$img:stable,$img:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$img:latest,$img:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            FLOW_BUILD_SHA=${{ github.sha }}
            FLOW_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
